<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<!-- The prerendered pages get their policy from SvelteKit's csp config;
		     this static page carries its own. Nothing loads but the inline style. -->
		<meta
			http-equiv="content-security-policy"
			content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'"
		/>
		<title>Not found — BC Canvas</title>
		<!-- Served by Cloudflare Pages for any path the build doesn't hold. The
		     site is prerendered at / (homepage), /edit (editor) and /docs, so
		     every other URL lands here. Static and self-contained: no hashed
		     asset names to chase, system fonts stand in for Archivo, tokens
		     copied from src/app.css. -->
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-content: center;
				gap: 0.75rem;
				background-color: #eae7de;
				color: #1a1e20;
				font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
				text-align: center;
				padding: 2rem;
			}
			h1 {
				font-size: 1.25rem;
				font-weight: 600;
				margin: 0;
			}
			p {
				margin: 0;
				color: #50564f;
			}
			a {
				color: #1a1e20;
			}
		</style>
	</head>
	<body>
		<h1>Nothing at this address</h1>
		<p>BC Canvas has three pages — the <a href="/">homepage</a>, the <a href="/edit">editor</a> and the <a href="/docs">docs</a>.</p>
	</body>
</html>
